# Docker Compose for Agent Worker Node Architecture
#
# Services:
#   - redis: Message queue and result backend
#   - api: FastAPI server (accepts requests, enqueues tasks)
#   - worker: Celery worker (processes agent tasks)
#
# Usage:
#   docker-compose up --build
#   docker-compose up -d              # Run in background
#   docker-compose logs -f worker     # Follow worker logs
#   docker-compose down               # Stop all services

services:
  # Redis: Message queue for Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # FastAPI: HTTP API server
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_PATH=/app/data/tasks.db
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      # Mount for SQLite persistence (shared with worker)
      - task_data:/app/data

  # Celery Worker: Processes agent tasks
  worker:
    build: .
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_PATH=/app/data/tasks.db
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A tasks worker --loglevel=info
    volumes:
      # Mount for SQLite persistence (shared with api)
      - task_data:/app/data

volumes:
  redis_data:
  task_data:
